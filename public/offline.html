<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>Seedance Studio · 离线</title>
    <style>
      :root { color-scheme: light; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        color: #111;
        background-color: #d2d2d0;
        background-image: linear-gradient(rgb(17 17 17 / 5.5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(17 17 17 / 5.5%) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      main { width: min(100%, 560px); border: 1px solid rgb(17 17 17 / 38%); padding: 32px; background: rgb(210 210 208 / 88%); }
      p { color: #4a4a4a; line-height: 1.7; }
      button { min-height: 44px; border: 0; padding: 0 20px; color: #f3f3ef; background: #111; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Seedance Studio</h1>
      <p>当前离线。视频生成需要网络连接，请恢复网络后重试。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
